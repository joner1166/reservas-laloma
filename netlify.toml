[build]
  command = "npm run build"
  publish = "dist"
  functions = "netlify/functions"

# SPA (React Router / Vite)
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

# API functions (opcional, recomendado si llamas /api/...)
[[redirects]]
  from = "/api/*"
  to = "/.netlify/functions/:splat"
  status = 200
